{% extends "base.html" %}
{% block title %}{{ code }} — LibMS{% endblock %}
{% block topbar_title %}Error{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:60vh;">
  <div style="text-align:center;max-width:420px;">
    <div style="font-family:var(--serif);font-size:5rem;font-weight:700;color:var(--gray-100);line-height:1;margin-bottom:1rem;">{{ code }}</div>
    <div style="font-family:var(--serif);font-size:1.4rem;color:var(--navy);margin-bottom:.5rem;">{{ title }}</div>
    <p style="color:var(--gray-500);font-size:.875rem;margin-bottom:1.5rem;">{{ message }}</p>
    <a href="/dashboard" class="btn btn-primary">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
